<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speed Pay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">Speed Pay</div>

<div class="page active" id="home">
  <div class="card balance-card">
    <p>Total Balance</p>
    <h1><span id="balance">0</span> USDT</h1>
  </div>
</div>

<div class="page" id="recharge">
  <div class="card">
    <h3>Recharge (USDT TRC20)</h3>
    <input placeholder="Enter Amount">
    <button>Submit Recharge</button>
  </div>
</div>

<div class="page" id="team">
  <div class="card">
    <h3>My Team</h3>
    <p>Referral system coming soon</p>
  </div>
</div>

<div class="page" id="account">
  <div class="card">
    <h3>Withdraw (Bank)</h3>
    <input placeholder="Bank Name">
    <input placeholder="Account Number">
    <input placeholder="IFSC Code">
    <input placeholder="Amount">
    <button>Withdraw</button>
  </div>
</div>

<div class="bottom-nav">
  <button onclick="showPage('home')">Home</button>
  <button onclick="showPage('recharge')">Recharge</button>
  <button onclick="showPage('team')">Team</button>
  <button onclick="showPage('account')">Account</button>
</div>

<script src="app.js"></script>
</body>
</html>
