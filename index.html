<!DOCTYPE html>
<html>
<head>
  <title>Speed Pay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Speed Pay - User Dashboard</h2>

<div class="card">
  <p><b>Balance:</b> <span id="balance">0</span> USDT</p>
</div>

<div class="card">
  <h3>Recharge (USDT TRC20)</h3>
  <input id="amount" placeholder="Enter Amount">
  <button onclick="recharge()">Submit Recharge</button>
</div>

<div class="card">
  <h3>Withdraw (Bank)</h3>
  <input id="bank" placeholder="Bank Name">
  <input id="acc" placeholder="Account Number">
  <input id="ifsc" placeholder="IFSC">
  <input id="wamount" placeholder="Amount">
  <button onclick="withdraw()">Withdraw</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
